---
- name: Munge | Install Munge packages
  package:
    name: "{{ item }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  loop: "{{ (ansible_facts['os_family'] == 'Debian') | ternary(munge_packages_apt, munge_packages_rpm) }}"
  tags: [munge, munge_install]

- name: Munge | Copy munge.key from project root to all nodes
  copy:
    src: munge.key  # Path from role to project root
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: '0400'
    backup: yes
  notify: restart munge
  tags: [munge, munge_key]

- name: Munge | Create systemd override for munge service | create directory
  file: 
    path: "/etc/systemd/system/munge.service.d/"
    state: directory
  tags: [munge, munge_conf]

- name: Munge | Create systemd override for munge service | create file
  copy:
    dest: /etc/systemd/system/munge.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/sbin/munged --trusted-group={{ slurm_admin_user_gid }} $OPTIONS
  become: yes
  notify: restart munge
  tags: [munge, munge_service]

- name: Munge | Reload systemd
  systemd:
    daemon_reload: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [munge, munge_service]

- name: Munge | Enable and start munge service
  systemd:
    name: munge
    enabled: yes
    state: started
  tags: [munge, munge_service]
  ignore_errors: "{{ ansible_check_mode }}"

- name: Munge | Restart munge services
  systemd_service:
    state: restarted
    enabled: true
    daemon_reexec: true
    name: munge
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [munge, munge_service]
