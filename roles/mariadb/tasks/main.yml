---
- name: Install MariaDB server and client
  become: true
  package:
    name: "{{ item }}"
    state: present
  loop: "{{ (ansible_facts['os_family'] == 'Debian') | ternary(mariadb_packages_apt, mariadb_packages_rpm) }}"
  when: inventory_hostname in groups['slurm_controllers']
  tags: [mariadb, mariadb_install]

- name: Start and enable MariaDB service
  become: true
  systemd:
    name: mariadb
    enabled: yes
    state: started
  when: inventory_hostname in groups['slurm_controllers']
  tags: [mariadb, mariadb_service]
  ignore_errors: "{{ ansible_check_mode }}"

- name: Wait for MariaDB to be ready
  become: true
  wait_for:
    path: "{{ (ansible_facts['os_family'] == 'Debian') | ternary('/run/mysqld/mysqld.sock', '/var/lib/mysql/mysql.sock') }}"
    state: present
    timeout: 30
  when: inventory_hostname in groups['slurm_controllers']
  tags: [mariadb, mariadb_setup]

- name: Create Slurm database
  become: true
  command:
    cmd: "mysql -e 'CREATE DATABASE IF NOT EXISTS slurm_acct_db;'"
  when: inventory_hostname in groups['slurm_controllers']
  tags: [mariadb, mariadb_setup]

- name: Create Slurm database user without password
  become: true
  command:
    cmd: "mysql -e \"CREATE USER IF NOT EXISTS 'slurm'@'localhost';\""
  when: inventory_hostname in groups['slurm_controllers']
  tags: [mariadb, mariadb_setup]

- name: Grant privileges to Slurm user
  become: true
  command:
    cmd: "mysql -e 'GRANT ALL PRIVILEGES ON slurm_acct_db.* TO \"slurm\"@\"localhost\";'"
  when: inventory_hostname in groups['slurm_controllers']
  tags: [mariadb, mariadb_setup]

- name: Flush privileges
  become: true
  command:
    cmd: "mysql -e 'FLUSH PRIVILEGES;'"
  when: inventory_hostname in groups['slurm_controllers']
  tags: [mariadb, mariadb_setup]

- name: Display database setup completion
  become: true
  debug:
    msg: "MariaDB setup completed - Slurm database and user created without password"
  when: inventory_hostname in groups['slurm_controllers']
  tags: [mariadb, mariadb_setup]
