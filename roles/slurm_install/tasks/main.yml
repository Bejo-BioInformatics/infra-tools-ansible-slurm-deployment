---
# https://www.linkedin.com/pulse/slurm-setup-easy-way-ubuntu-2404-practical-guide-building-nagaraj-s-tj7cc

- name: SLURM Install | Install Slurm Controller packages in Controller
  package:
    name: "{{ item }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: yes
  when: inventory_hostname in groups['slurm_controllers']
  loop: "{{ (ansible_facts['os_family'] == 'Debian') | ternary(slurm_packages_controller_apt + slurm_packages_shared_apt, slurm_packages_controller_rpm + slurm_packages_shared_rpm) }}"
  tags: [slurm, slurm_install]

- name: SLURM Install | UnInstall Slurm Deamon packages in Controller
  package:
    name: "{{ item }}"
    state: absent
    update_cache: true
    cache_valid_time: 3600
  become: yes
  when: inventory_hostname in groups['slurm_controllers']
  loop: "{{ (ansible_facts['os_family'] == 'Debian') | ternary(slurm_packages_worker_apt, slurm_packages_worker_rpm) }}"
  tags: [slurm, slurm_install]



- name: SLURM Install | Install Slurm Worker packages in Worker
  package:
    name: "{{ item }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: yes
  when: inventory_hostname in groups['slurm_computes']
  loop: "{{ (ansible_facts['os_family'] == 'Debian') | ternary(slurm_packages_worker_apt + slurm_packages_shared_apt, slurm_packages_worker_rpm + slurm_packages_shared_rpm) }}"
  tags: [slurm, slurm_install]

- name: SLURM Install | UnInstall Slurm Controller packages in Worker
  package:
    name: "{{ item }}"
    state: absent
    update_cache: true
    cache_valid_time: 3600
  become: yes
  when: inventory_hostname in groups['slurm_computes']
  loop: "{{ (ansible_facts['os_family'] == 'Debian') | ternary(slurm_packages_controller_apt, slurm_packages_controller_rpm) }}"
  tags: [slurm, slurm_install]



- name: SLURM Install | reload systemd
  systemd:
    daemon_reload: yes



- name: SLURM Install | Enable and start Slurm Controller services in Controllers
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: restarted
  loop:
    - slurmctld
    # - slurmdbd
    # - slurmrestd
  become: yes
  when: inventory_hostname in groups['slurm_controllers']
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm, slurm_install]

- name: SLURM Install | Enable and start Slurm Worker services in Workers
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: restarted
  loop:
    - slurmd
    # - slurmdbd
  become: yes
  when: inventory_hostname in groups['slurm_computes']
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm, slurm_install]



- name: SLURM Install | Restart Slurm Controller services in Controllers
  systemd_service:
    state: restarted
    enabled: true
    daemon_reexec: true
    name: "{{ item }}"
  loop:
    - slurmctld
    - slurmdbd
  become: yes
  when: inventory_hostname in groups['slurm_controllers']
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm, slurm_install]

- name: SLURM Install | Restart Slurm Worker services in Workers
  systemd_service:
    state: restarted
    enabled: true
    daemon_reexec: true
    name: "{{ item }}"
  loop:
    - slurmd
    # - slurmdbd
  become: yes
  when: inventory_hostname in groups['slurm_computes']
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm, slurm_install]



- name: SLURM Install | reload systemd
  systemd:
    daemon_reload: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm, slurm_install]
