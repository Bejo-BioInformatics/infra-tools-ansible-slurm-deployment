---
- name: SLURM Install | 3. Restart | reload systemd
  systemd:
    daemon_reload: yes
  tags: [slurm, slurm_install, slurm_restart]


- name: SLURM Install | 3. Restart | Enable and start Slurm Controller services in Controllers
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: restarted
  loop:
    - slurmctld
    # - slurmdbd
    # - slurmrestd
  become: yes
  when: inventory_hostname in groups['slurm_controllers']
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm, slurm_install, slurm_restart]

- name: SLURM Install | 3. Restart | Enable and start Slurm Worker services in Workers
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: restarted
  loop:
    - slurmd
    # - slurmdbd
  become: yes
  when: inventory_hostname in groups['slurm_computes']
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm, slurm_install, slurm_restart]



- name: SLURM Install | 3. Restart | Restart Slurm Controller services in Controllers
  systemd_service:
    state: restarted
    enabled: true
    daemon_reexec: true
    name: "{{ item }}"
  loop:
    - slurmctld
    - slurmdbd
  become: yes
  when: inventory_hostname in groups['slurm_controllers']
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm, slurm_install, slurm_restart]

- name: SLURM Install | 3. Restart | Restart Slurm Worker services in Workers
  systemd_service:
    state: restarted
    enabled: true
    daemon_reexec: true
    name: "{{ item }}"
  loop:
    - slurmd
    # - slurmdbd
  become: yes
  when: inventory_hostname in groups['slurm_computes']
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm, slurm_install, slurm_restart]



- name: SLURM Install | 3. Restart | reload systemd
  systemd:
    daemon_reload: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm, slurm_install, slurm_restart]
