- name: NFS | Enable and start NFS services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: restarted
  loop:
    - rpcbind
    - nfs-server
  when: (inventory_hostname in groups['slurm_controllers'])
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [nfs, nfs_deps, nfs_deps_install, nfs_deps_server_install]



- name: NFS | Change permissions for NFS mount directory
  file:
    path: "{{ item.dst_path }}"
    state: directory
    owner: slurm
    group: slurm
    mode: "0777"
  loop: "{{ nfs_mounts }}"
  when: nfs_mounts is defined and nfs_mounts | length > 0 and item.mode == "rw" and (inventory_hostname not in groups['slurm_controllers'])
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [nfs, nfs_mount, nfs_perms]



- name: NFS | Mount NFS volumes
  mount:
    src:  "{{ hostvars[slurm_primary_controller_name].ansible_facts.hostname }}:{{ item.src_path }}"
    path: "{{ item.dst_path }}"
    opts: "{{ item.mode }},{{ item.options }}"
    boot: true
    state: mounted
    fstype: nfs
  loop: "{{ nfs_mounts }}"
  when: (inventory_hostname not in groups['slurm_controllers'])
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [nfs, nfs_mount]
