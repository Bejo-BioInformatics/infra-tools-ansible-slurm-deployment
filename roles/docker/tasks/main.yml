---
# Reference: https://dev.to/lovestaco/install-docker-with-ansible-on-ubuntu-official-repo-docker-compose-578b
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
  ignore_errors: "{{ ansible_check_mode }}"
  when: (inventory_hostname in groups['slurm_controllers'])
  tags: [docker]

- name: Ensure dependencies are installed
  ansible.builtin.package:
    name:
      - bc
      - curl
      - expect
      - git
      - ca-certificates
    state: present
  when: (inventory_hostname in groups['slurm_controllers'])
  tags: [docker]

- name: Create Docker GPG key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: (inventory_hostname in groups['slurm_controllers'])
  tags: [docker]

- name: Download Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: (inventory_hostname in groups['slurm_controllers'])
  tags: [docker]

- name: Add Docker repository to Apt sources
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker
  when: (inventory_hostname in groups['slurm_controllers'])
  tags: [docker]

- name: Update apt cache after adding Docker repository
  ansible.builtin.apt:
    update_cache: yes
  when: (inventory_hostname in groups['slurm_controllers'])
  tags: [docker]

- name: Install Docker and Docker Compose
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: (inventory_hostname in groups['slurm_controllers'])
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [docker]

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
  when: (inventory_hostname in groups['slurm_controllers'])
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [docker]

- name: Add main user to docker group
  ansible.builtin.user:
    name: "{{ ansible_ssh_user | default('ubuntu') }}"
    groups: docker
    append: yes
  when: (inventory_hostname in groups['slurm_controllers'])
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [docker]
