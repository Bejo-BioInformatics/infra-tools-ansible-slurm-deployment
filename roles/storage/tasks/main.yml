---
- name: Install NFS packages
  package:
    name: "{{ item }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: yes
  loop: "{{ (ansible_facts['os_family'] == 'Debian') | ternary(nfs_packages_apt, nfs_packages_rpm) }}"
  tags: [storage, storage_install]



- name: UnMount NFS volumes
  mount:
    src:  "{{ item.value.host }}:{{ item.value.src_path }}"
    path: "{{ item.value.dst_path }}"
    opts: "{{ item.value.mode }},{{ item.value.options }}"
    boot: true
    state: absent
    fstype: nfs
  loop: "{{ nfs_hosts | dict2items }}"
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [storage,  storage_nfs]



- name: Create NFS mount directories
  block:
    - name: Create NFS mount directories | Ensure NFS mount directory exists
      stat:
        path: "{{ item.value.dst_path }}"
      register: stat_results
      with_items: "{{ nfs_hosts | dict2items }}"

    - name: Create NFS mount directories | Create NFS mount directory
      file:
        path: "{{ item.item.value.dst_path }}"
        state: directory
        recurse: yes
        owner: slurm
        group: slurm
        mode: "0777"
      when: not item.stat.exists
      with_items: "{{ stat_results.results }}"
  # loop: "{{ nfs_hosts | dict2items }}"
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [storage, storage_nfs]



- name: Mount NFS volumes
  mount:
    src:  "{{ item.value.host }}:{{ item.value.src_path }}"
    path: "{{ item.value.dst_path }}"
    opts: "{{ item.value.mode }},{{ item.value.options }}"
    boot: true
    state: mounted
    fstype: nfs
  loop: "{{ nfs_hosts | dict2items }}"
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [storage,  storage_nfs]



- name: Change permissions for NFS mount directory
  file:
    path: "{{ item.value.dst_path }}"
    state: directory
    owner: slurm
    group: slurm
    mode: "0777"
  loop: "{{ nfs_hosts | dict2items }}"
  when: nfs_hosts is defined and nfs_hosts | length > 0 and item.value.mode == "rw"
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [storage, storage_nfs]
