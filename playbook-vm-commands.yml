---
# https://oneuptime.com/blog/post/2026-03-02-how-to-configure-slurm-workload-manager-on-ubuntu/view
- name: Run Azure VM Commands
  hosts: localhost
  become: yes
  gather_facts: no

  tasks:
    - name: start
      command: bash -c 'az login --identity && az vm start   --resource-group {{ hostvars[item].ansible_host_resource_group }} --name {{ hostvars[item].ansible_host_name }} --verbose'
      loop: "{{ groups['all'] }}"
      tags: [start]

    - name: stop
      command: bash -c 'az login --identity && az vm stop    --resource-group {{ hostvars[item].ansible_host_resource_group }} --name {{ hostvars[item].ansible_host_name }} --verbose'
      loop: "{{ groups['all'] }}"
      tags: [stop]
  
    - name: restart
      command: bash -c 'az login --identity && az vm restart --resource-group {{ hostvars[item].ansible_host_resource_group }} --name {{ hostvars[item].ansible_host_name }} --verbose'
      loop: "{{ groups['all'] }}"
      tags: [restart]
