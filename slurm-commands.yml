---
# https://oneuptime.com/blog/post/2026-03-02-how-to-configure-slurm-workload-manager-on-ubuntu/view
- name: Run Slurm Commands
  hosts: slurm_controllers
  become: yes
  gather_facts: no

  tasks:
    - name: Show Cluster Info
      command: sinfo
      register: cluster_info
    - debug:
        var: cluster_info.stdout

    - name: Show Node Information
      command: sinfo -N -r -l
      register: node_info
    - debug:
        var: node_info.stdout

    - name: Show Cluster Nodes
      command: scontrol show nodes
      register: cluster_nodes
    - debug:
        var: cluster_nodes.stdout

    - name: Show Cluster Jobs
      command: squeue -a
      register: cluster_jobs
    - debug:
        var: cluster_jobs.stdout

    # - name: Show Cluster Queues
    #   command: scontrol show queues

    - name: Show completed jobs
      command: sacct --format=JobID,JobName,Partition,State,ExitCode,Elapsed,MaxRSS
      register: completed_jobs
    - debug:
        var: completed_jobs.stdout

    - name: Show Fair Share Priority
      command: sshare -l
      register: fair_share_priority
    - debug:
        var: fair_share_priority.stdout

    - name: Show Job Priority
      command: sprio -l
      register: job_priority
    - debug:
        var: job_priority.stdout

    - name: Show Job Completion Statistics
      command: sacct --format=JobID,JobName,Partition,State,ExitCode,Elapsed,MaxRSS --state=COMPLETED
      register: completed_job_stats
    - debug:
        var: completed_job_stats.stdout

    - name: Run a test job on 2 nodes
      command: srun -N 2 hostname
      register: test_job_output
    - debug:
        var: test_job_output.stdout

    - name: copy the output to a local file
      copy:
        content: |
          #{{ slurm_cluster_name }}
          
          ## Cluster Info
          {{ cluster_info.stdout }}
          
          ## Node Info
          {{ node_info.stdout }}
          
          
          ## Cluster Nodes
          {{ cluster_nodes.stdout }}
          
          ## Cluster Jobs
          {{ cluster_jobs.stdout }}
          
          ## Completed Jobs
          {{ completed_jobs.stdout }}
          
          ## Fair Share Priority
          {{ fair_share_priority.stdout }}
          
          ## Job Priority
          {{ job_priority.stdout }}
          
          ## Completed Job Stats
          {{ completed_job_stats.stdout }}
          
          ## Test Job Output
          {{ test_job_output.stdout }}
        dest: "/data/slurm-{{ slurm_cluster_name }}-cluster_info.txt"
      delegate_to: localhost
    - name: Fetch slurm.conf
      fetch:
        src: /etc/slurm/slurm.conf
        dest: "/data/slurm-{{ slurm_cluster_name }}-slurm.conf"
        flat: yes
        validate_checksum: true
    - name: Change file ownership, group and permissions
      delegate_to: localhost
      ansible.builtin.file:
        path: "/data/slurm-{{ slurm_cluster_name }}-cluster_info.txt"
        owner: 1002
        group: 502
        mode: '0644'
    - name: Change file ownership, group and permissions for slurm.conf
      delegate_to: localhost
      ansible.builtin.file:
        path: "/data/slurm-{{ slurm_cluster_name }}-slurm.conf"
        owner: 1002
        group: 502
        mode: '0644'

